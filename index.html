<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CoorCraft - Bloc de Notas de Coordenadas Moderno">
    <meta name="theme-color" content="#3b82f6">
    <title>CoorCraft - Gestor de Coordenadas</title>
    <style>
        /* ============================================
           VARIABLES Y TEMAS
           ============================================ */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #cbd5e1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --cursor-color: #3b82f6;
        }

        @media (prefers-color-scheme: dark) {
            :root.theme-dark,
            :root:not(.theme-light) {
                --bg-primary: #0b0f19;
                --bg-secondary: #1e293b;
                --text-primary: #e2e8f0;
                --text-secondary: #cbd5e1;
                --accent: #60a5fa;
                --accent-hover: #3b82f6;
                --border: #334155;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
                --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            }
        }

        :root.theme-dark {
            --bg-primary: #0b0f19;
            --bg-secondary: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --border: #334155;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           RESET Y BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            line-height: 1.6;
            overflow-x: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Cursor personalizado solo en PC */
        @media (hover: hover) and (pointer: fine) {
            body {
                cursor: none;
            }
        }

        /* ============================================
           LAYOUT PRINCIPAL Y CONTENEDOR
           ============================================ */
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            perspective: 1200px;
        }

        header {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 1rem;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 16px;
            font-size: 0.95em;
            transition: var(--transition);
            font-family: inherit;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* ============================================
           BOTONES Y CONTROLES
           ============================================ */
        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-icon {
            background: var(--bg-secondary);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.2em;
            box-shadow: var(--shadow);
        }

        .btn-icon:hover {
            background: var(--border);
            transform: scale(1.05);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.85em;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85em;
        }

        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 1.5rem;
        }

        /* ============================================
           GRID DE NOTAS
           ============================================ */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .note-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .note-card:hover::before {
            opacity: 1;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        .note-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .note-coordinates {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
            padding: 0.75rem;
            border-radius: 8px;
            margin: 0.75rem 0;
            word-break: break-all;
            line-height: 1.5;
        }

        .note-timestamp {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .timestamp-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timestamp-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .note-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .note-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.85em;
        }

        .badge-updated {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-size: 0.75em;
            margin-top: 0.5rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ============================================
           MODALES Y FORMULARIOS
           ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: slideUpModal 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        @keyframes slideUpModal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.3em;
            color: var(--text-primary);
        }

        .btn-close {
            background: none;
            font-size: 1.5em;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-close:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95em;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-actions button {
            flex: 1;
        }

        /* ============================================
           PANEL DE CONFIGURACIÓN
           ============================================ */
        .settings-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: var(--bg-primary);
            border-left: 1px solid var(--border);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            backdrop-filter: blur(12px);
        }

        .settings-panel.active {
            right: 0;
        }

        .settings-content {
            padding: 2rem 1.5rem;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .settings-header h2 {
            font-size: 1.3em;
        }

        .settings-section {
            margin-bottom: 2rem;
        }

        .settings-section h3 {
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .settings-option {
            margin-bottom: 1.2rem;
        }

        .settings-option label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            padding: 0.75rem;
            border-radius: 12px;
            transition: var(--transition);
        }

        .settings-option label:hover {
            background: var(--bg-secondary);
        }

        .settings-option input[type="radio"],
        .settings-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .color-option {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: var(--text-primary);
            box-shadow: 0 0 0 3px var(--bg-secondary);
        }

        .color-native-picker {
            width: 60px;
            height: 50px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .storage-info {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .storage-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .storage-used {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            transition: width 0.3s ease-out;
        }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.85em;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ============================================
           CURSOR PERSONALIZADO
           ============================================ */
        .custom-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), transparent);
            border: 2px solid var(--cursor-color);
            box-shadow: 0 0 8px var(--cursor-color), inset 0 0 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s ease-out, opacity 0.2s ease-out;
            opacity: 0.9;
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .custom-cursor {
                display: block;
            }
        }

        .custom-cursor.active {
            transform: scale(1.3);
            opacity: 1;
        }

        .custom-cursor.clicking {
            transform: scale(0.8);
            opacity: 0.8;
        }

        /* ============================================
           NOTIFICACIONES
           ============================================ */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            animation: slideInToast 0.3s ease-out;
            z-index: 1001;
            max-width: 300px;
        }

        @keyframes slideInToast {
            from {
                opacit
